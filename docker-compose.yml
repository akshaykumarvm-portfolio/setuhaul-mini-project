# Optional containerised local run. Without Docker: `uvicorn booking.api:app` + local Postgres.
# Redis is Upstash (REDIS_URL in .env).
services:
  booking:
    build: { context: ., dockerfile: booking/Dockerfile }
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/setuhaul
      SNAPSHOT_URI: /seed/setuhaul_schema_and_seed.sql
    volumes:
      - ./data:/seed:ro
    depends_on: [postgres]

  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
